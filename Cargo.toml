[package]
name = "netlistquery"
license = "MIT"
description = "Library and CLI for querying EDA netlists"
authors = ["Maciej Małecki <me@mmalecki.com>"]
version = "0.1.2-1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
asdi = { version = "0.2.5", git = "https://github.com/mmalecki/rust-asdi.git", branch = "remove-run-printlns" }
clap = { version = "4.6.0", features = ["derive"] }
lexpr = "0.2.7"
rustyline = "18.0.0"
serde_json = "1.0.149"
